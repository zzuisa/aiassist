asyncapi: 3.0.0
info:
  title: Calendar Event Note Image Processing
  version: 1.0.0
  description: Versioned command emitted after a task-note image is durably associated.
channels:
  taskNoteImageProcess:
    address: image.process.task-note
    messages:
      processTaskNoteImage:
        $ref: '#/components/messages/ProcessTaskNoteImage'
operations:
  requestTaskNoteImageProcessing:
    action: send
    channel:
      $ref: '#/channels/taskNoteImageProcess'
    messages:
      - $ref: '#/channels/taskNoteImageProcess/messages/processTaskNoteImage'
components:
  messages:
    ProcessTaskNoteImage:
      name: task_note_asset.process.requested
      title: Generate a sanitized task-note image preview
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProcessTaskNoteImagePayload'
  schemas:
    ProcessTaskNoteImagePayload:
      type: object
      additionalProperties: false
      required: [event_id, trace_id, user_id, task_id, note_id, asset_id, job_id, processing_version]
      properties:
        event_id: { type: string, format: uuid }
        trace_id: { type: string }
        user_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        note_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        processing_version: { type: string, const: v1 }
