openapi: 3.1.0
info:
  title: Blog Content Management API Delta
  version: 1.0.0
  description: >-
    Private blog-module additions for feature 005. Existing public post and RSS
    contracts remain unchanged and are intentionally not expanded here.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /posts:
    get:
      summary: List owned posts with blog filters
      parameters:
        - { $ref: '#/components/parameters/SearchQuery' }
        - { $ref: '#/components/parameters/ContentClass' }
        - { $ref: '#/components/parameters/ContentTypeId' }
        - { $ref: '#/components/parameters/ContentStatus' }
        - { $ref: '#/components/parameters/AiDisplayStatus' }
        - { $ref: '#/components/parameters/SourceType' }
        - { $ref: '#/components/parameters/CategoryId' }
        - { $ref: '#/components/parameters/TagId' }
        - { $ref: '#/components/parameters/KeywordId' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Cursor page of owned posts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
    post:
      summary: Create an empty owned draft and first revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreate' }
      responses:
        '201':
          description: Durably saved draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}:
    get:
      summary: Get one owned current article and its organization summary
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200':
          description: Current article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Save user edits with optimistic concurrency and create a revision
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostPatch' }
      responses:
        '200':
          description: Saved current article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Soft-delete an owned non-published article
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/visual-assets/{asset_id}.png:
    get:
      summary: Stream an owned generated visual PNG for an article
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - name: asset_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Private generated visual asset
          content:
            image/png: {}
        '404': { $ref: '#/components/responses/Problem' }
  /posts/captures/clipboard:
    post:
      summary: Save original clipboard content and create a draft before AI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipboardCapture' }
      responses:
        '201':
          description: Source and article are durably saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureResult' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /posts/captures/url:
    post:
      summary: Save a URL source, pending article and extraction job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UrlCapture' }
      responses:
        '202':
          description: Source and article are saved; extraction is asynchronous
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureResult' }
        '422': { $ref: '#/components/responses/Problem' }
  /posts/captures/quick:
    post:
      summary: Save a minimal quick record into triage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickCapture' }
      responses:
        '201':
          description: Quick record saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureResult' }
        '422': { $ref: '#/components/responses/Problem' }
  /post-sources/{source_id}:
    get:
      summary: Get owned source metadata and bounded original content
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostSource' }
        '404': { $ref: '#/components/responses/Problem' }
  /post-sources/{source_id}/retry:
    post:
      summary: Create a new extraction attempt for a failed or partial URL source
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '202':
          description: New extraction job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogJob' }
        '409': { $ref: '#/components/responses/Problem' }
  /post-sources/{source_id}/snapshot-access:
    get:
      summary: Authorize access to an owned private source snapshot
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: Same-origin or short-lived access reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetAccess' }
        '404': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/optimize:
    post:
      summary: Submit AI work bound to the current revision and fixed Skill version
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimizationRequest' }
      responses:
        '202':
          description: Durable job and run binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogJob' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/candidates:
    get:
      summary: List AI candidates for an owned Post
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - in: query
          name: status
          schema: { type: string, enum: [pending, merge_required, applied, rejected, copied] }
      responses:
        '200':
          description: Candidate summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiCandidate' }
  /posts/{post_id}/candidates/{candidate_id}:
    get:
      summary: Get three-way candidate comparison data
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/CandidateId' }
      responses:
        '200':
          description: Base, current and candidate snapshots with field diffs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateComparison' }
        '404': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/candidates/{candidate_id}/decide:
    post:
      summary: Apply selected fields, reject, keep current or copy candidate
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/CandidateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateDecision' }
      responses:
        '200':
          description: Decision and optional new current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDecisionResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/versions:
    get:
      summary: List immutable versions
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Version page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionPage' }
  /posts/{post_id}/versions/{revision_id}:
    get:
      summary: Get one complete owned revision snapshot
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/RevisionId' }
      responses:
        '200':
          description: Revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostRevision' }
        '404': { $ref: '#/components/responses/Problem' }
  /posts/{post_id}/versions/compare:
    get:
      summary: Compare two owned revision snapshots
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - in: query
          name: left
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: right
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Body and field diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDiff' }
  /posts/{post_id}/versions/{revision_id}/restore:
    post:
      summary: Create a new current revision from a historical snapshot
      parameters:
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/RevisionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [post_version]
              properties:
                post_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Restored as a new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '409': { $ref: '#/components/responses/Problem' }
  /blog/triage:
    get:
      summary: List Posts derived into the triage work queue
      parameters:
        - { $ref: '#/components/parameters/SourceType' }
        - { $ref: '#/components/parameters/ContentClass' }
        - { $ref: '#/components/parameters/AiDisplayStatus' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Triage Post page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
  /blog/triage/merge:
    post:
      summary: Merge ordered source Posts into a new draft without deleting sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageMerge' }
      responses:
        '201':
          description: New merged draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '422': { $ref: '#/components/responses/Problem' }
  /blog/content-types:
    get:
      summary: List owned enabled and historical content types
      responses:
        '200':
          description: Content types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentType' }
    post:
      summary: Create a configurable content type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentTypeWrite' }
      responses:
        '201':
          description: Created content type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentType' }
        '422': { $ref: '#/components/responses/Problem' }
  /blog/skills:
    get:
      summary: List owned Skill identities and current versions
      parameters:
        - in: query
          name: enabled
          schema: { type: boolean }
        - { $ref: '#/components/parameters/ContentClass' }
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
    post:
      summary: Create a Skill identity and immutable first version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillWrite' }
      responses:
        '201':
          description: Created Skill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '422': { $ref: '#/components/responses/Problem' }
  /blog/skills/{skill_id}:
    get:
      summary: Get one owned Skill and current configuration
      parameters: [{ $ref: '#/components/parameters/SkillId' }]
      responses:
        '200':
          description: Skill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change Skill identity fields and optionally create a new version
      parameters: [{ $ref: '#/components/parameters/SkillId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillWrite' }
      responses:
        '200':
          description: Updated Skill with immutable new version when config changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '409': { $ref: '#/components/responses/Problem' }
  /blog/skills/{skill_id}/versions:
    get:
      summary: List immutable Skill versions
      parameters: [{ $ref: '#/components/parameters/SkillId' }]
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkillVersion' }
  /blog/skills/{skill_id}/versions/{skill_version_id}/restore:
    post:
      summary: Copy a historical config into a new current version
      parameters:
        - { $ref: '#/components/parameters/SkillId' }
        - { $ref: '#/components/parameters/SkillVersionId' }
      responses:
        '201':
          description: New current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillVersion' }
  /blog/skill-defaults:
    get:
      summary: List current global, class and type Skill defaults
      responses:
        '200':
          description: Defaults
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkillDefault' }
    put:
      summary: Set or replace one unique Skill default scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillDefaultWrite' }
      responses:
        '200':
          description: Effective default and replaced binding if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDefault' }
        '422': { $ref: '#/components/responses/Problem' }
  /blog/taxonomy/{kind}:
    get:
      summary: List categories, tags or keywords with usage counts
      parameters:
        - { $ref: '#/components/parameters/TaxonomyKind' }
        - in: query
          name: enabled
          schema: { type: boolean }
      responses:
        '200':
          description: Taxonomy items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxonomyItem' }
    post:
      summary: Create a category, tag or keyword
      parameters: [{ $ref: '#/components/parameters/TaxonomyKind' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyWrite' }
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyItem' }
  /blog/taxonomy/{kind}/{item_id}:
    patch:
      summary: Update a taxonomy item while preserving disabled historical values
      parameters:
        - { $ref: '#/components/parameters/TaxonomyKind' }
        - in: path
          name: item_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyPatch' }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyItem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /blog/taxonomy/keyword/recompute:
    post:
      summary: Recompute automatic keyword links without replacing manual links
      responses:
        '202':
          description: Durable recomputation job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogJob' }
  /blog/taxonomy/{kind}/merge:
    post:
      summary: Merge one taxonomy item into another and preserve an audit mapping
      parameters: [{ $ref: '#/components/parameters/TaxonomyKind' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, target_id]
              properties:
                source_id: { type: string, format: uuid }
                target_id: { type: string, format: uuid }
      responses:
        '200':
          description: Completed merge or durable background job
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/TaxonomyItem' }
                  - { $ref: '#/components/schemas/BlogJob' }
        '409': { $ref: '#/components/responses/Problem' }
  /blog/search:
    get:
      summary: Search owned blog title, body, code, source and structured fields
      parameters:
        - { $ref: '#/components/parameters/SearchQueryRequired' }
        - { $ref: '#/components/parameters/ContentClass' }
        - { $ref: '#/components/parameters/ContentTypeId' }
        - { $ref: '#/components/parameters/CategoryId' }
        - { $ref: '#/components/parameters/TagId' }
        - { $ref: '#/components/parameters/KeywordId' }
        - { $ref: '#/components/parameters/AiDisplayStatus' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Search page with match fields and safe highlights
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
  /blog/timeline:
    get:
      summary: Return owned articles grouped by occurrence or creation time
      parameters:
        - in: query
          name: time_basis
          schema: { type: string, enum: [occurred_at, created_at], default: occurred_at }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/ContentClass' }
        - { $ref: '#/components/parameters/ContentTypeId' }
        - { $ref: '#/components/parameters/CategoryId' }
        - { $ref: '#/components/parameters/TagId' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Timeline page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
  /blog/word-cloud:
    get:
      summary: Get the last successful word-cloud snapshot for normalized filters
      parameters:
        - in: query
          name: source_kind
          required: true
          schema: { type: string, enum: [tag, keyword] }
        - in: query
          name: filter
          schema: { type: string, description: Canonical encoded filter JSON }
      responses:
        '200':
          description: Last successful snapshot or empty state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordCloudSnapshot' }
    post:
      summary: Create or rebuild one word-cloud snapshot asynchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WordCloudRequest' }
      responses:
        '202':
          description: Rebuild job plus previous snapshot when available
          content:
            application/json:
              schema:
                type: object
                required: [job, previous]
                properties:
                  job: { $ref: '#/components/schemas/BlogJob' }
                  previous: { oneOf: [{ $ref: '#/components/schemas/WordCloudSnapshot' }, { type: 'null' }] }
  /blog/settings:
    get:
      summary: Get effective blog settings, safe defaults and warnings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogSettings' }
    put:
      summary: Replace blog settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogSettingsWrite' }
      responses:
        '200':
          description: Validated effective settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogSettings' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /jobs:
    get:
      summary: Existing job list extended with optional blog scope and display status
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [blog] }
        - in: query
          name: status
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Owned jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogJob' }
  /jobs/completed:
    delete:
      security:
        - sessionCookie: []
      summary: Clear the current user's completed job history
      responses:
        '200':
          description: Number of deleted jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClearCompletedJobs' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
  parameters:
    PostId: { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
    SourceId: { in: path, name: source_id, required: true, schema: { type: string, format: uuid } }
    CandidateId: { in: path, name: candidate_id, required: true, schema: { type: string, format: uuid } }
    RevisionId: { in: path, name: revision_id, required: true, schema: { type: string, format: uuid } }
    SkillId: { in: path, name: skill_id, required: true, schema: { type: string, format: uuid } }
    SkillVersionId: { in: path, name: skill_version_id, required: true, schema: { type: string, format: uuid } }
    TaxonomyKind: { in: path, name: kind, required: true, schema: { type: string, enum: [category, tag, keyword] } }
    SearchQuery: { in: query, name: q, schema: { type: string, maxLength: 500 } }
    SearchQueryRequired: { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
    ContentClass: { in: query, name: content_class, schema: { type: string, maxLength: 32 } }
    ContentTypeId: { in: query, name: content_type_id, schema: { type: string, format: uuid } }
    ContentStatus: { in: query, name: content_status, schema: { type: string, maxLength: 32 } }
    AiDisplayStatus: { in: query, name: ai_status, schema: { type: string, maxLength: 32 } }
    SourceType: { in: query, name: source_type, schema: { type: string, maxLength: 24 } }
    CategoryId: { in: query, name: category_id, schema: { type: string, format: uuid } }
    TagId: { in: query, name: tag_id, schema: { type: string, format: uuid } }
    KeywordId: { in: query, name: keyword_id, schema: { type: string, format: uuid } }
    Cursor: { in: query, name: cursor, schema: { type: string, maxLength: 500 } }
  responses:
    Problem:
      description: RFC 9457 problem details; never contains private raw content
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Post:
      type: object
      additionalProperties: false
      required: [id, title, markdown, status, content_status, content_class, language, structured_data, version, current_revision_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 240 }
        subtitle: { type: [string, 'null'], maxLength: 240 }
        summary: { type: [string, 'null'], maxLength: 2000 }
        markdown: { type: string, maxLength: 200000 }
        status: { type: string, enum: [draft, private, published] }
        content_status: { $ref: '#/components/schemas/ContentStatus' }
        content_class: { type: string, maxLength: 32 }
        content_type_id: { type: [string, 'null'], format: uuid }
        category_id: { type: [string, 'null'], format: uuid }
        tag_ids: { type: array, items: { type: string, format: uuid }, maxItems: 50 }
        keyword_ids: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
        language: { type: string, maxLength: 16 }
        editor_mode: { type: string, enum: [markdown, rich, split] }
        occurred_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'], maxLength: 240 }
        project: { type: [string, 'null'], maxLength: 240 }
        structured_data: { type: object, maxProperties: 100 }
