name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Mypy
        run: mypy
      - name: Repository whitespace check
        working-directory: .
        run: git diff --check

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aiassist_test
          POSTGRES_USER: aiassist
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiassist" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.2-management
        env:
          RABBITMQ_DEFAULT_USER: aiassist
          RABBITMQ_DEFAULT_PASS: testpass
          RABBITMQ_DEFAULT_VHOST: aiassist
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 15s --health-timeout 10s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aiassist:testpass@localhost:5432/aiassist_test
      TEST_DATABASE_URL: postgresql+psycopg://aiassist:testpass@localhost:5432/aiassist_test
      REDIS_URL: redis://localhost:6379/0
      AMQP_URL: amqp://aiassist:testpass@localhost:5672/aiassist
      JWT_SIGNING_KEY: ci-test-signing-key-not-a-secret-value-000000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit, contract, integration and reliability coverage
        run: >-
          pytest
          -m "(unit or contract or integration or reliability) and not security and not performance and not broker"
          --cov=app --cov-report= --cov-fail-under=0 -q
      - name: Security tests and aggregate coverage gate
        run: >-
          pytest -m "security and not performance and not broker"
          --cov=app --cov-append --cov-report=term-missing --cov-report=xml
          --cov-fail-under=70 -q
      - name: Broker round-trip tests
        run: pytest -m broker -q
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit/component tests
        run: npm test
      - name: Production build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          for secret_name in postgres_password jwt_signing_key rabbitmq_password smtp_password llm_provider_key radio_service_password s3_access_key s3_secret_key; do
            printf 'ci-placeholder-value-not-a-secret-000000' > "deploy/secrets/${secret_name}"
          done
          : > deploy/secrets/mcp_connections.json
          RABBITMQ_DEFAULT_PASS=ci-placeholder-value-not-a-secret-000000 \
            docker compose --profile s3 --profile tools config --quiet

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:18080
      E2E_EMAIL: ci-e2e@example.com
      E2E_PASSWORD: ci-e2e-password-not-a-secret
      RABBITMQ_DEFAULT_PASS: ci-placeholder-value-not-a-secret-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare isolated Compose configuration
        run: |
          cp .env.example .env
          sed -i 's#^APP_BASE_URL=.*#APP_BASE_URL=http://127.0.0.1:18080#' .env
          sed -i 's#^APP_ALLOWED_ORIGINS=.*#APP_ALLOWED_ORIGINS=http://127.0.0.1:18080#' .env
          for secret_name in postgres_password jwt_signing_key rabbitmq_password smtp_password llm_provider_key radio_service_password s3_access_key s3_secret_key; do
            printf 'ci-placeholder-value-not-a-secret-000000' > "deploy/secrets/${secret_name}"
          done
          : > deploy/secrets/mcp_connections.json
          chmod 600 deploy/secrets/*_password deploy/secrets/jwt_signing_key deploy/secrets/*_key
          sudo chown 10001 deploy/secrets/*
          sudo mkdir -p /www/wwwlogs/aiassist/{backend,outbox-publisher,worker-fast,worker-heavy,celery-beat,nginx}
          sudo chmod -R 777 /www/wwwlogs/aiassist
      - name: Build and start application stack
        run: >-
          docker compose up -d --build --wait --wait-timeout 240
          frontend backend outbox-publisher worker-fast worker-heavy celery-beat nginx
      - name: Seed E2E account
        run: >-
          printf '%s\n%s\n' "$E2E_PASSWORD" "$E2E_PASSWORD" |
          docker compose exec -T backend
          python -m app.cli.main create-admin --email "$E2E_EMAIL"
      - name: Verify gateway and worker routing
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18080/health/ready
          docker compose exec -T worker-fast celery -A app.workers.celery_app.celery inspect ping --timeout 10
          docker compose exec -T worker-heavy celery -A app.workers.celery_app.celery inspect ping --timeout 10
      - name: Authenticated blog, 360px and Agent API E2E
        working-directory: frontend
        run: >-
          npm run test:e2e --
          tests/e2e/blog-content-management.spec.ts
          tests/e2e/accessibility.spec.ts
          tests/e2e/agent-api-validation.spec.ts
          --project=desktop-chromium --workers=1
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-e2e.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            compose-e2e.log
          if-no-files-found: ignore
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v --remove-orphans

  performance-100k:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aiassist_test
          POSTGRES_USER: aiassist
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiassist" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aiassist:testpass@localhost:5432/aiassist_test
      TEST_DATABASE_URL: postgresql+psycopg://aiassist:testpass@localhost:5432/aiassist_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-test-signing-key-not-a-secret-value-000000
      SEARCH_PERF_ROWS: "100000"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run 100,000-row performance gate
        run: pytest -m performance -q --junitxml=performance-results.xml
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-100k-results
          path: backend/performance-results.xml
          if-no-files-found: error
