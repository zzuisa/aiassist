# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "🐳 chore: 初始化项目"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "🐳 chore: 保存澄清前进度"
  before_plan:
    enabled: false
    message: "🐳 chore: 保存规划前进度"
  before_tasks:
    enabled: false
    message: "🐳 chore: 保存任务生成前进度"
  before_implement:
    enabled: false
    message: "🐳 chore: 保存实施前进度"
  before_checklist:
    enabled: false
    message: "🐳 chore: 保存检查前进度"
  before_analyze:
    enabled: false
    message: "🐳 chore: 保存分析前进度"
  before_taskstoissues:
    enabled: false
    message: "🐳 chore: 保存议题同步前进度"
  after_constitution:
    enabled: false
    message: "📃 docs: 更新项目宪章"
  after_specify:
    enabled: false
    message: "📃 docs: 更新功能规格"
  after_clarify:
    enabled: false
    message: "📃 docs: 澄清功能规格"
  after_plan:
    enabled: false
    message: "📃 docs: 更新实施计划"
  after_tasks:
    enabled: false
    message: "📃 docs: 更新任务清单"
  after_implement:
    enabled: false
    message: "✨ feat: 实现规格功能"
  after_checklist:
    enabled: false
    message: "📃 docs: 更新检查清单"
  after_analyze:
    enabled: false
    message: "📃 docs: 更新分析报告"
  after_taskstoissues:
    enabled: false
    message: "🐳 chore: 同步任务到议题"
